<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeOps — Mission Accomplished</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #05070a);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .success-card {
            background: rgba(0, 210, 255, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 2rem;
        }

        .line { color: var(--primary); margin-right: 10px; }

        .btn {
            background: #ffffff;
            color: #000;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .timestamp {
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.4;
        }

        /* Animated Background Elements */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(var(--primary), var(--secondary));
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="circle" style="width: 400px; height: 400px; top: -100px; right: -100px;"></div>
    <div class="circle" style="width: 300px; height: 300px; bottom: -50px; left: -50px;"></div>

    <div class="container">
        <div class="badge">Success Integration</div>
        <h1>Mission <br>Accomplished</h1>
        <p>You have successfully engineered and deployed a fully autonomous, offline-first DevOps platform.</p>
        
        <div class="success-card">
            <div><span class="line">></span>Platform: <span th:text="${platform}">ForgeOps</span></div>
            <div><span class="line">></span>Status: COMPLETED_SUCCESSFULLY</div>
            <div><span class="line">></span>Integrations: Jenkins, Gitea, Nexus, Registry</div>
        </div>

        <a href="http://localhost/" class="btn">Back to Control Center</a>
        
        <div class="timestamp">
            Deployed at: <span th:text="${timestamp}">—</span>
        </div>
    </div>
</body>
</html>
